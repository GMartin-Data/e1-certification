AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  e1-certification
  AWS Serverless ETL pipeline and REST API for Excel to MySQL data transformation

# Global settings for all lambda functions
Globals:
  Function:
    Runtime: python3.12
    Timeout: 900
    MemorySize: 1024
    Environment:
      Variables:
        LOG_LEVEL: INFO

Parameters:
  # Allow environment-specific configurations
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - prod
    Description: "Deployment environment (dev for development, prod for final presentation)"

Resources:
  # S3 Bucket for Excel file uploads
  ExcelFilesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "e1-certification-excel-${Environment}-${AWS::AccountId}"
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  # Lambda Function for Excel Processing
  ProcessExcelFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-process-excel"
      CodeUri: src/
      Handler: e1_certification.lambda_handlers.process_excel.lambda_handler
      Environment:
        Variables:
          DB_HOST: !GetAtt DatabaseInstance.Endpoint.Address
          DB_NAME: e1_certification
          DB_USER: admin
          DB_PASSWORD_PARAM: !Sub "/e1-certification/${Environment}/db-password"
          S3_BUCKET_NAME: !Ref ExcelFilesBucket
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref ExcelFilesBucket
        - SSMParameterReadPolicy:
            ParameterName: !Sub "e1-certification/${Environment}/*"

  # Lambda Function for REST API
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-api-lambda"
      CodeUri: src/
      Handler: e1_certification.api.main.handler # Points to Mangum handler
      Environment:
        Variables:
          DB_HOST: !GetAtt DatabaseInstance.Endpoint.Address
          DB_NAME: e1_certification
          DB_USER: admin
          DB_PASSWORD_PARAM: !Sub "/e1-certification/${Environment}/db-password"
          JWT_SECRET_KEY_PARAM: !Sub "/e1-certification/${Environment}/jwt-secret"
          LOG_LEVEL: INFO
      Policies:
        - SSMParameterReadPolicy:
            ParameterName: !Sub "e1-certification/${Environment}/*"
        - VPCAccessPolicy: {}
      VpcConfig:
        SecurityGroupIds:
          - !GetAtt DatabaseSecurityGroup.GroupId
        SubnetIds:
          - subnet-0bb0adfe654d9079a
          - subnet-03435c1a336da7a90
      Events:
        ApiEvent:
          Type: Api # SAM shorthand for API Gateway integration
          Properties:
            Path: /{proxy+} # Catch-all path - forwards any URL path to Lambda
            Method: ANY # Accepts all HTTP methods (GET, POST, PUT, DELETE, etc.)
            RestApiId: !Ref ApiGateway

  # API Gateway
  ApiGateway:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub "${AWS::StackName}-api-gateway"
      StageName: !Ref Environment
      # CORS Configuration
      # ⚠️ WARNING: This is a DEVELOPMENT configuration!
      # TODO: For production, implement proper CORS:
      # - AllowOrigin: "'https://your-frontend-domain.com'"
      # - AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
      # - AllowHeaders: "'Content-Type,Authorization'"
      # - AllowCredentials: true
      Cors:
        AllowMethods: "'*'" # ⚠️ DEV ONLY - Too permissive!
        AllowHeaders: "'*'" # ⚠️ DEV ONLY - Too permissive!
        AllowOrigin: "'*'" # ⚠️ DEV ONLY - Allows any website!
        MaxAge: "'86400'" # OK - 24 hour cache
      Auth:
        DefaultAuthorizer: NONE # JWT handled in app

        # EventBridge Schedule Rule
        # This triggers the Lambda on a defined schedule

  BatchProcessingSchedule:
    Type: AWS::Events::Rule
    Properties:
      Description: "Trigger batch ETL processing every Sunday at 1:30 AM UTC"
      ScheduleExpression: "cron(30 1 ? * SUN *)"
      # Test option (commented out):
      # ScheduleExpression: "rate(5 minutes)"  # For testing
      State: ENABLED
      Targets:
        - Arn: !GetAtt ProcessExcelFunction.Arn
          Id: "BatchETLTarget"

  # Permission for EventBridge to invoke Lambda
  BatchProcessingPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ProcessExcelFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt BatchProcessingSchedule.Arn

  # Security Group for RDS
  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for RDS MySQL instance
      VpcId: vpc-0989125da50851c97
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          CidrIp: 0.0.0.0/0 # We'll restrict this later
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-db-sg"

  # DB Subnet Group for RDS(using existing subnets)
  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnet group for RDS MySQL instance
      SubnetIds:
        - subnet-0bb0adfe654d9079a # eu-west-3a
        - subnet-03435c1a336da7a90 # eu-west-3b
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-db-subnet-group"

  # RDS MySQL Instance
  DatabaseInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: !Sub "${AWS::StackName}-mysql"
      DBInstanceClass: db.t3.micro # Smallest/cheapest instance
      Engine: mysql
      EngineVersion: "8.0.39"
      MasterUsername: admin
      # GitGuardian: This is a reference to AWS SSM, not an actual password
      MasterUserPassword: !Sub "{{resolve:ssm-secure:/e1-certification/${Environment}/db-password}}"
      DBName: e1_certification
      AllocatedStorage: "20" # 20 GB minimum
      StorageType: gp2
      VPCSecurityGroups:
        - !GetAtt DatabaseSecurityGroup.GroupId
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      BackupRetentionPeriod: 0 # No backups (saves money)
      MultiAZ: false # Single AZ (saves money)
      PubliclyAccessible: true # So you can connect from home
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-mysql"

Outputs:
  # Output important values for use in application
  ExcelBucketName:
    Description: S3 bucket name for Excel file uploads
    Value: !Ref ExcelFilesBucket
    Export:
      Name: !Sub "${AWS::StackName}-ExcelBucketName"

  Region:
    Description: AWS region
    Value: !Ref AWS::Region
    Export:
      Name: !Sub "${AWS::StackName}-Region"

  ProcessExcelFunctionArn:
    Description: ARN of the Excel processing Lambda function
    Value: !GetAtt ProcessExcelFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-ProcessExcelFunctionArn"

  # EventBridge Rule ARN
  BatchProcessingScheduleArn:
    Description: ARN of the EventBridge batch processing rule
    Value: !GetAtt BatchProcessingSchedule.Arn
    Export:
      Name: !Sub "${AWS::StackName}-BatchProcessingScheduleArn"

  # API related outputs
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"
    Export:
      Name: !Sub "${AWS::StackName}-ApiUrl"

  ApiFunctionArn:
    Description: ARN of the API Lambda function
    Value: !GetAtt ApiFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-ApiFunctionArn"
